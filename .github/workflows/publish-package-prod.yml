name: publish ikomida prod lib to artifact registry on pull request merge
on:
  pull_request_target:
    types:
      - closed
    branches:
      - prod
jobs:
  build_and_deploy_ikomida:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted
    env:
      -CI_COMMIT_MESSAGE: "Add "
    steps:
      - uses: actions/checkout@v3
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v0"
        with:
          credentials_json: "${{ secrets.ARTIFACT_REGISTRY_IKOMIDA_DEV_SERVICE_ACOUNT }}"
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 16.x.x
          cache: yarn
      - name: Auth npm with artifactregistry
        run: |
          rm .npmrc || true
          echo "@ikomida:registry=https://us-central1-npm.pkg.dev/ikomida-prod/node/" >> .npmrc
          echo "//us-central1-npm.pkg.dev/ikomida-prod/node/:always-auth=true" >> .npmrc
          yarn glogin
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Publish npm package
        run: npm publish
      - name: Update branch tag version
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          PACKAGE_VERSION=$(cat package.json | grep \\\"version\\\" | head -1 | awk -F: '{ print $2 }' | sed 's/[\",]//g' | tr -d '[[:space:]]')
          git tag "v${PACKAGE_VERSION}"
          git push origin "v${PACKAGE_VERSION}"
